<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>충남대 안전·편의 지도</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef1ec; --paper:#f8faf6; --ink:#1d2621; --muted:#5f6b63; --line:#cfd6cc;
  --aed:#d92b2b; --ext:#e8771a; --elev:#4b5b8c; --water:#1f8fbf; --me:#2563eb;
  --accent:#00543c; --sheet:#ffffff; --warn:#b7791f;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141a17; --paper:#1a211d; --ink:#e6ece7; --muted:#9aa79e; --line:#2f3a34;
  --aed:#ff5a5a; --ext:#ff9a45; --elev:#8fa0d6; --water:#4cc0ec; --me:#6aa0ff;
  --accent:#4fc59a; --sheet:#1e2622; --warn:#e0a84a; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);overflow:hidden}
[hidden]{display:none!important}
button{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--me);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0px)}
.gut{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
header{padding-block:10px 6px;display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
header h1{font-size:17px;margin:0}
header p{margin:0;font-size:12px;color:var(--muted)}
.hbtn{margin-left:auto;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:7px 10px;font-size:13px;cursor:pointer;white-space:nowrap}
.hbtn.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.pickers{display:flex;gap:8px;padding-block:4px}
.pickers select{flex:1;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:6px 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 11px;font:500 13px var(--f-body);display:flex;align-items:center;gap:6px;cursor:pointer}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip[aria-pressed="false"]{opacity:.45}
.chip .n{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.mapwrap{flex:1;min-height:0;position:relative}
#map{position:absolute;inset:0}
.gpsbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:500;background:var(--ink);color:var(--bg);font-size:12.5px;padding:7px 12px;border-radius:999px;white-space:nowrap;max-width:76%;overflow:hidden;text-overflow:ellipsis}
.locate{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:calc(84px + env(safe-area-inset-bottom));z-index:500;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-size:20px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.locate.on{color:var(--me);border-color:var(--me)}
.fab{position:absolute;z-index:500;left:max(12px,env(safe-area-inset-left));right:max(12px,env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:8px}
.btn{border:0;border-radius:14px;padding:13px 14px;font:700 15px var(--f-body);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn-sos{flex:1.4;background:var(--aed);color:#fff;box-shadow:0 4px 14px rgba(217,43,43,.35)}
.btn-add{flex:1;background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn-pri{background:var(--accent);color:#fff}
.btn-pri:disabled{opacity:.45}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.btn-danger{background:transparent;color:var(--aed);border:1px solid var(--aed)}
.btn-sm{padding:8px 10px;font-size:13px;border-radius:10px}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:600;background:var(--sheet);border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.2);padding-top:10px;padding-bottom:calc(16px + env(safe-area-inset-bottom));max-height:80%;overflow-y:auto}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
h2{margin:0 0 2px;font-size:18px;text-wrap:balance}
.meta{font-size:13px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font:500 11px var(--f-mono);padding:2px 7px;border-radius:6px;color:#fff}
.tag.out{background:transparent;color:var(--muted);border:1px dashed var(--muted)}
.tag.pend{background:var(--warn)}
.row{display:flex;gap:8px;margin-top:14px}.row>*{flex:1;min-width:0}
.photo{margin-top:12px;border-radius:12px;max-height:240px;width:100%;object-fit:cover}
.stats{margin-top:12px;display:flex;gap:18px}
.stats b{font:500 22px var(--f-mono);display:block;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}
form{display:flex;flex-direction:column;gap:12px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500}
input,select{font:400 16px var(--f-body);padding:10px 11px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.types button{border:1.5px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:9px 2px;font:500 12.5px var(--f-body);cursor:pointer}
.types button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.shot{border:1.5px dashed var(--line);border-radius:12px;padding:18px;text-align:center;color:var(--muted);font-size:14px;cursor:pointer;display:block}
.shot img{width:100%;max-height:180px;object-fit:cover;border-radius:8px}
.locbox{display:flex;align-items:center;gap:8px;font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.locbox .st{flex:1;min-width:0;overflow-wrap:anywhere}
.note{font-size:12px;color:var(--muted);line-height:1.5;margin:0}
.toast{position:fixed;z-index:2000;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:10px;font-size:13px;max-width:90%;text-align:center}
.pin{border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);font-size:11px}
.me-dot{width:18px;height:18px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 6px rgba(37,99,235,.25)}
.pick{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);border:2px solid #fff}
.blabel{background:var(--accent);color:#fff;font:700 12px var(--f-body);padding:4px 8px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-140%);display:inline-block}
/* 건물 층별 목록 */
.floors{margin-top:12px;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.fl{display:grid;grid-template-columns:56px 1fr;border-top:1px solid var(--line)}
.fl:first-child{border-top:0}
.fl.hl{background:color-mix(in srgb,var(--accent) 10%,transparent)}
.fl .no{font:500 13px var(--f-mono);padding:8px 0;text-align:center;background:var(--paper);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.fl .no .planbtn{margin:0}
.fl .items{display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;min-width:0}
.fl .empty{color:var(--muted);font-size:12px;padding:3px 0}
.it{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);border-radius:999px;padding:4px 9px 4px 5px;font-size:12.5px;cursor:pointer;max-width:100%}
.it i{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 9px var(--f-body);font-style:normal;flex:none}
.it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* 관리자 화면 */
.admin{position:fixed;inset:0;z-index:1500;background:var(--bg);overflow-y:auto;padding-top:calc(12px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.admin .top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.admin .top h2{flex:1}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.login{max-width:380px;margin:30px auto 0}
.tabs{display:flex;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:9px;font:500 13.5px var(--f-body);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{display:flex;flex-direction:column;gap:10px;max-width:640px;margin:0 auto}
.rep{display:grid;grid-template-columns:88px 1fr;gap:12px}
.rep img,.rep .nophoto{width:88px;height:88px;border-radius:10px;object-fit:cover;background:var(--paper);display:grid;place-items:center;color:var(--muted);font-size:11px}
.rep .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.rep .t{font-weight:700}
.rep .acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.frow{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--sheet);border:1px solid var(--line);border-radius:12px}
.frow .d{flex:1;min-width:0}
.frow .d b{display:block;font-size:14px}
.frow .d span{font-size:12px;color:var(--muted)}
.badge{min-width:18px;height:18px;border-radius:9px;background:var(--aed);color:#fff;font:700 11px var(--f-mono);display:inline-grid;place-items:center;padding:0 5px;margin-left:4px}
.mask{-webkit-text-security:disc}
.guide{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gtoggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:0;background:var(--paper);color:var(--ink);padding:12px;font:700 14.5px var(--f-body);cursor:pointer}
.gtoggle span{font:500 12px var(--f-body);color:var(--muted)}
.gbody{padding:4px 12px 12px;display:flex;flex-direction:column;gap:10px}
.gbefore{margin:6px 0 0;font-size:13px;line-height:1.55;background:color-mix(in srgb,var(--aed) 9%,transparent);border-radius:8px;padding:9px 10px}
.gsteps{margin:0;padding:0;list-style:none;counter-reset:g;display:flex;flex-direction:column;gap:8px}
.gsteps li{counter-increment:g;display:grid;grid-template-columns:26px 1fr;gap:2px 8px;font-size:13.5px;line-height:1.5}
.gsteps li::before{content:counter(g);grid-row:span 2;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font:700 12px var(--f-mono)}
.gsteps b{font-size:14px}
.gsteps span{color:var(--muted)}
.gacts{display:flex;gap:6px;flex-wrap:wrap}.gacts>*{flex:1;min-width:0}
.pv{position:fixed;inset:0;z-index:1400;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.pv-top{display:flex;align-items:center;gap:8px;padding-block:10px 6px}
.pv-top h2{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv-tabs{display:flex;gap:6px;overflow-x:auto;padding-block:2px 8px;scrollbar-width:none}
.pv-tabs button{flex:none;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;padding:6px 12px;font:500 13px var(--f-mono);cursor:pointer}
.pv-tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.pv-tabs button.has{position:relative}
.pv-tabs button.has::after{content:"";position:absolute;top:3px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--aed)}
#pvMap{flex:1;min-height:0;background:#e9ece8}
.pv-foot{padding-block:8px calc(10px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.pv-foot .chips2{display:flex;gap:6px;flex-wrap:wrap}
.pv-foot .chips2 span{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink)}
.pv-pin{position:relative;width:30px;height:30px}
.pv-pin .dot{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 13px var(--f-body);border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.pv-pin.hl .ring{position:absolute;inset:-12px;border-radius:50%;border:3px solid #d92b2b;animation:pvp 1.4s ease-out infinite}
@keyframes pvp{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.3);opacity:0}}
@media (prefers-reduced-motion:reduce){.pv-pin.hl .ring{animation:none}}
.planbtn{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:6px;font:600 11px var(--f-body);padding:1px 6px;margin-left:4px;cursor:pointer}
.demo{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:12.5px;line-height:1.5}
</style>
</head>
<body>
<div class="app">
  <header class="gut">
    <div class="logo">CNU</div>
    <div style="min-width:0"><h1>충남대 안전·편의 지도</h1><p>길을알려조 · v2</p></div>
    <button class="hbtn" id="adminBtn">🔐 관리자</button>
  </header>
  <div class="pickers gut">
    <select id="bSel" aria-label="건물 선택"></select>
    <select id="fSel" aria-label="층 선택" style="flex:.55"></select>
  </div>
  <div class="chips gut" id="chips"></div>
  <div class="mapwrap">
    <div id="map"></div>
    <div class="gpsbar" id="gps">위치 권한을 허용하면 내 위치가 표시돼요</div>
    <button class="locate" id="locate" aria-label="내 위치 따라가기">◎</button>
    <div class="fab" id="fab">
      <button class="btn btn-sos" id="sos">⚡ 가장 가까운 AED</button>
      <button class="btn btn-add" id="addBtn">📷 제보하기</button>
    </div>
    <div class="sheet gut" id="sheet" hidden></div>
  </div>
</div>
<div class="pv" id="pv" hidden>
  <div class="pv-top gut"><h2 id="pvTitle">내부지도</h2><button class="btn btn-ghost btn-sm" id="pvClose">닫기 ✕</button></div>
  <div class="pv-tabs gut" id="pvTabs"></div>
  <div id="pvMap"></div>
  <div class="pv-foot gut" id="pvFoot"></div>
</div>
<div class="admin gut" id="admin" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

   설정

   - 비워두면(null): 시연 모드. 데이터는 이 기기에만 저장, 관리자 비번은 DEMO_ADMIN_PASSWORD
   ========================================================= */

  aed:{name:"AED",full:"자동심장충격기",color:"#d92b2b",glyph:"♥",size:30},

};

  "공대 1호관":{lat:36.36762,lng:127.34463,floors:["1F", "2F", "3F", "4F"]},

  "산학연교육연구관":{lat:36.36565,lng:127.34469,floors:["1F", "2F", "3F", "4F", "5F", "6F", "7F", "8F", "9F"]},

/* ---------- 실시간 위치 ---------- */
/* GPS 튐 줄이기
   1) 오차가 너무 큰 값(60m 초과)은 이미 좋은 위치가 있으면 버림
   2) 사람이 걸을 수 없는 속도(초속 7m 이상)로 순간이동한 값은 버림 (3번 연속이면 진짜 이동으로 인정)
   3) 칼만 필터로 정확한 값일수록 더 믿고, 부정확한 값은 조금만 반영해서 부드럽게 이어줌 */
const GPS={lat:null,lng:null,v:-1,t:0,rejects:0,lastGood:0};
const WALK_MS=3;            // 걷는 속도 가정 (m/s)
function gpsFilter(p){
  const lat=p.coords.latitude,lng=p.coords.longitude,acc=Math.max(p.coords.accuracy,3),t=p.timestamp||Date.now();
  if(GPS.v<0){Object.assign(GPS,{lat,lng,v:acc*acc,t,lastGood:t});return{lat,lng,acc}}
  const dt=Math.max((t-GPS.t)/1000,0.1);
  const jump=haversine({lat:GPS.lat,lng:GPS.lng},{lat,lng});
  const curAcc=Math.sqrt(GPS.v);
  const badAcc=acc>60&&curAcc<=60&&t-GPS.lastGood<20000;
  const teleport=jump>Math.max(25,acc)&&jump/dt>7;
  if((badAcc||teleport)&&GPS.rejects<2){GPS.rejects++;return null}
  GPS.rejects=0;if(acc<=60)GPS.lastGood=t;
  GPS.v+=dt*WALK_MS*WALK_MS;                         // 시간이 지날수록 불확실성 증가
  const k=GPS.v/(GPS.v+acc*acc);                     // 새 값을 얼마나 믿을지
  GPS.lat+=k*(lat-GPS.lat);GPS.lng+=k*(lng-GPS.lng);GPS.v=(1-k)*GPS.v;GPS.t=t;
  return{lat:GPS.lat,lng:GPS.lng,acc:Math.round(Math.sqrt(GPS.v)*10)/10,raw:acc};
}
function startGPS(){
  if(!("geolocation" in navigator)){$("gps").textContent="이 브라우저는 위치 기능을 지원하지 않아요";return}
  if(!window.isSecureContext){$("gps").textContent="https 주소에서 열어야 위치를 쓸 수 있어요";return}
  navigator.geolocation.watchPosition(p=>{
    const f=gpsFilter(p);if(!f)return;               // 튀는 값은 버림
    me=f;const ll=[me.lat,me.lng];
    if(!meMarker){meMarker=L.marker(ll,{icon:L.divIcon({className:"",iconSize:[18,18],html:'<div class="me-dot"></div>'}),zIndexOffset:1000}).addTo(map);
      meCircle=L.circle(ll,{radius:me.acc,color:"#2563eb",weight:1,fillOpacity:.08}).addTo(map);map.setView(ll,17)}
    else{meMarker.setLatLng(ll);meCircle.setLatLng(ll).setRadius(me.acc);if(follow)map.panTo(ll)}
    $("gps").textContent=`실시간 위치 · 오차 약 ${Math.round(me.acc)}m${me.raw>30?" · 신호 약함":""}`;$("locate").classList.toggle("on",follow);
    if(picking&&picking.useGps){picking.lat=me.lat;picking.lng=me.lng;picking.locMsg=`GPS 현재 위치 (오차 ${Math.round(me.acc)}m)`;pickMarker&&pickMarker.setLatLng(ll);const e=$("locst");if(e)e.textContent=locText()}
    if(route)onMoveRoute();
  },err=>{$("gps").textContent=err.code===1?"위치 권한이 꺼져 있어요 · 브라우저 설정에서 허용해주세요":"위치를 잡지 못했어요 · 실외에서 다시 시도해보세요"},
  {enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
$("locate").onclick=()=>{follow=true;$("locate").classList.add("on");if(me)map.setView([me.lat,me.lng],18);else toast("아직 위치를 못 잡았어요")};

/* ---------- 길찾기 (OSM 도보 경로) ---------- */
async function fetchWalk(a,b){
  const url=`https://routing.openstreetmap.de/routed-foot/route/v1/driving/${a.lng},${a.lat};${b.lng},${b.lat}?overview=full&geometries=geojson`;
  const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),8000);
  try{const r=await fetch(url,{signal:ctl.signal});const j=await r.json();clearTimeout(t);
    if(j.code!=="Ok"||!j.routes.length)throw 0;const R=j.routes[0];
    return{coords:R.geometry.coordinates.map(c=>[c[1],c[0]]),dist:Math.round(R.distance),min:Math.max(1,Math.round(R.duration/60)),real:true}}
  catch(e){clearTimeout(t);const d=haversine(a,b);return{coords:[[a.lat,a.lng],[b.lat,b.lng]],dist:d,min:Math.max(1,Math.round(d/75)),real:false}}
}
async function startRoute(target){
  if(!route||route.target!==target)guideOpen=target.type==="aed"||target.type==="ext";
  if(!me){toast("내 위치를 잡아야 길찾기를 할 수 있어요");return}
  toast("도보 경로를 찾는 중…");
  const r=await fetchWalk(me,target);
  route={target,origin:{...me},last:Date.now(),...r};
  if(routeLayer)map.removeLayer(routeLayer);
  routeLayer=L.layerGroup([
    L.polyline(r.coords,{color:"#ffffff",weight:9,opacity:.9}),
    L.polyline(r.coords,{color:target.type==="aed"?"#d92b2b":"#2563eb",weight:5,dashArray:r.real?null:"8 8"}),
    L.circleMarker([target.lat,target.lng],{radius:9,color:"#fff",weight:3,fillColor:"#00543c",fillOpacity:1})
  ]).addTo(map);
  follow=false;map.fitBounds(L.latLngBounds(r.coords),{padding:[70,70],maxZoom:18});
  showRouteSheet();
}

   <div class="meta"><span class="tag" style="background:${t.type?TYPES[t.type].color:"var(--accent)"}">${t.type?TYPES[t.type].name:"건물"}</span><span>${r.real?"도보 경로":"직선 경로 (경로 서버 응답 없음)"}</span></div>

   ${t.memo?`<p style="margin:2px 0 0">${esc(t.memo)}</p>`:""}
   ${guideHTML(t.type)}
   <div class="stats"><div><b>${r.dist}m</b><span>경로 거리</span></div><div><b>${r.min}분</b><span>도보 예상</span></div><div><b id="left">${left}m</b><span>남은 직선거리</span></div></div>
   ${t.floor&&t.floor!=="1F"?`<p class="note" style="margin-top:10px">건물 도착 후 ${esc(t.floor)}(으)로 이동하세요.${S.facilities.some(f=>f.building===t.building&&f.type==="elev")?" 이 건물에는 엘리베이터가 있어요.":""}</p>`:""}
   <div class="row"><button class="btn btn-ghost btn-sm" id="reroute">↻ 다시 찾기</button><a class="btn btn-ghost btn-sm" target="_blank" rel="noopener" href="https://map.kakao.com/link/to/${encodeURIComponent(t.building)},${t.lat},${t.lng}">카카오맵</a><button class="btn btn-pri btn-sm" id="endRoute">안내 종료</button></div>
   ${PLANS[t.building]?`<button class="btn btn-ghost btn-sm" id="rPlan" style="width:100%;margin-top:8px">🗺 도착 후 볼 내부지도 (${esc(t.floor&&floorsOf(t)?.length===1?t.floor:"건물")})</button>`:""}`;
  s.hidden=false;$("fab").hidden=true;
  $("reroute").onclick=()=>startRoute(t);
  if($("rPlan"))$("rPlan").onclick=()=>openPlan(t.building,t.floor&&floorsOf(t)?.length===1?t.floor:null,t.id);
  $("endRoute").onclick=finishRoute;
  bindGuide(t.type,showRouteSheet);
}
function onMoveRoute(){
  const e=$("left");if(e)e.textContent=haversine(me,route.target)+"m";
  if(haversine(me,route.target)<15){toast("목적지에 도착했어요");finishRoute();return}
  if(haversine(me,route.origin)>40&&Date.now()-route.last>20000)startRoute(route.target);
}
function endRoute(){route=null;if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}}
function finishRoute(){endRoute();if("speechSynthesis" in window)speechSynthesis.cancel();closeSheet();selB="";selF="all";refresh();if(me){follow=true;$("locate").classList.add("on");map.setView([me.lat,me.lng],17)}}

/* ---------- 시설 상세 ---------- */
function showDetail(f){
  const t=TYPES[f.type],d=me?haversine(me,f):null,s=$("sheet");s.dataset.view="detail";
  s.innerHTML=`<div class="grab"></div>
  <div class="meta"><span class="tag" style="background:${t.color}">${t.name}</span>${f.src?`<span class="tag out">출처: ${esc(f.src)}</span>`:""}${f.approvedAt?'<span class="tag out">제보 승인</span>':""}</div>
  <h2 style="margin-top:8px">${esc(f.building)} <span style="font:500 15px var(--f-mono);color:var(--muted)">${esc(f.floor)}</span></h2>
  <p style="margin:4px 0 0;font-size:15px">${esc(f.memo)||"설명 없음"}</p>
  ${f.photo?`<img class="photo" src="${f.photo}" alt="현장 사진">`:""}
  ${d!=null?`<div class="stats"><div><b>${d}m</b><span>직선거리</span></div></div>`:'<p class="note" style="margin-top:12px">위치 권한을 허용하면 길찾기를 쓸 수 있어요.</p>'}
  <div class="row"><button class="btn btn-pri" id="go">🧭 길찾기</button><button class="btn btn-ghost" id="toB">건물 층별 보기</button></div>
  ${PLANS[f.building]?`<button class="btn btn-ghost" id="toPlan" style="width:100%;margin-top:8px">🗺 내부지도에서 ${f.px!=null?"위치 보기":"이 층 보기"}</button>`:""}
  ${S.isAdmin?'<div class="row" style="margin-top:8px"><button class="btn btn-danger btn-sm" id="del">이 시설 지도에서 제외</button></div>':""}
  ${f.type==="aed"?'<p class="note" style="margin-top:12px">응급 시 먼저 119에 신고하고, AED 전원을 켜면 음성 안내를 따라 하면 돼요.</p>':""}
  <button class="btn btn-ghost btn-sm" id="close" style="width:100%;margin-top:10px">닫기</button>`;
  s.hidden=false;$("fab").hidden=true;
  $("go").onclick=()=>startRoute(f);
  $("toB").onclick=()=>{selB=f.building;refresh();openBuilding(f.building)};
  if($("toPlan"))$("toPlan").onclick=()=>openPlan(f.building,floorsOf(f)?.length===1?f.floor:(selF!=="all"?selF:null),f.id);
  $("close").onclick=closeSheet;
  if($("del"))$("del").onclick=async()=>{if(!confirm(`${f.building} ${f.floor} ${t.name}을(를) 지도에서 제외할까요?`))return;await DB.delFacility(f.id).catch(()=>toast("삭제 권한이 없어요"));closeSheet();toast("시설을 제외했어요")};
}
function closeSheet(){const s=$("sheet");s.hidden=true;s.dataset.view="";$("fab").hidden=false;
  if(picking){picking=null;if(pickMarker){map.removeLayer(pickMarker);pickMarker=null}}
  if(route)setTimeout(()=>{if(route&&$("sheet").hidden)showRouteSheet()},0)}
$("sos").onclick=()=>{
  if(!me){toast("위치를 잡는 중이에요. 권한을 허용했는지 확인해주세요");return}
  const a=S.facilities.filter(f=>f.type==="aed");if(!a.length){toast("등록된 AED가 없어요");return}
  const n=a.reduce((b,f)=>!b||haversine(me,f)<haversine(me,b)?f:b,null);startRoute(n);
};

/* ---------- 제보 / 관리자 직접 추가 폼 ---------- */
function openForm(mode){ // mode: "report" | "admin"
  endRoute();
  picking={mode,type:"aed",photo:null,lat:null,lng:null,useGps:false,building:selB||"",floor:selF!=="all"?selF:"1F",memo:"",locMsg:"지도를 탭해 위치를 찍어주세요"};
  if(me)setPick(me.lat,me.lng,`GPS 현재 위치 (오차 ${Math.round(me.acc)}m)`,true);
  if(!picking.building)picking.building=me?nearestBuilding(me):"공대 5호관";
  renderForm();
}
$("addBtn").onclick=()=>openForm("report");
function setPick(lat,lng,msg,gps){
  picking.lat=lat;picking.lng=lng;picking.locMsg=msg;picking.useGps=!!gps;
  const ic=L.divIcon({className:"",iconSize:[26,26],iconAnchor:[13,26],html:'<div class="pick"></div>'});
  if(pickMarker)pickMarker.setLatLng([lat,lng]);else pickMarker=L.marker([lat,lng],{icon:ic,zIndexOffset:900}).addTo(map);
  if($("rf")){sync();renderForm()}
}
const locText=()=>picking.lat?`${picking.lat.toFixed(5)}, ${picking.lng.toFixed(5)} · ${picking.locMsg}`:picking.locMsg;
function renderForm(){
  const P=picking,s=$("sheet"),admin=P.mode==="admin";s.dataset.view="form";
  const fl=(BUILDINGS[P.building]||{floors:FLOORS}).floors;
  s.innerHTML=`<div class="grab"></div><h2>${admin?"시설 직접 추가":"시설 제보하기"}</h2>
  <p class="note" style="margin:2px 0 12px">${admin?"관리자가 추가한 시설은 바로 지도에 표시돼요.":"관리자가 확인하고 승인하면 지도에 표시돼요."} 지도를 탭하면 위치를 고칠 수 있어요.</p>
  <form id="rf">
   <div class="types">${Object.keys(TYPES).map(k=>`<button type="button" data-t="${k}" aria-pressed="${P.type===k}">${TYPES[k].name}</button>`).join("")}</div>
   <label class="shot" for="ph">${P.photo?`<img src="${P.photo}" alt="찍은 사진"><div style="margin-top:6px;font-size:12px">다시 찍으려면 탭</div>`:`📷 탭해서 사진 찍기${admin?" (선택)":""}`}</label>
   <input id="ph" type="file" accept="image/*" capture="environment" hidden>
   <div class="locbox"><span>📍</span><span class="st" id="locst">${esc(locText())}</span></div>
   <div class="row" style="margin-top:0"><label class="f">건물<select id="bd">${Object.keys(BUILDINGS).map(b=>`<option ${b===P.building?"selected":""}>${b}</option>`).join("")}</select></label>
   <label class="f" style="flex:.6">층<select id="fl">${(P.type==="elev"?["전층"]:[]).concat(fl).map(x=>`<option ${x===P.floor?"selected":""}>${x}</option>`).join("")}</select></label></div>
   <label class="f">상세 위치<input id="mm" value="${esc(P.memo)}" placeholder="예: 3층 계단 옆 벽면" maxlength="80"></label>
   <div class="row" style="margin-top:2px"><button type="button" class="btn btn-ghost" id="cx" style="flex:.5">취소</button><button class="btn btn-pri" id="sv" ${(admin||P.photo)&&P.lat?"":"disabled"}>${admin?"지도에 추가":"제보 보내기"}</button></div>
   ${admin?"":'<p class="note">사진이 있어야 관리자가 확인할 수 있어요. 사람 얼굴이 나오지 않게 찍어주세요.</p>'}
  </form>`;
  s.hidden=false;$("fab").hidden=true;
  s.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{sync();P.type=b.dataset.t;renderForm()});
  $("bd").onchange=()=>{sync();renderForm()};
  $("ph").onchange=async e=>{const f=e.target.files[0];if(!f)return;sync();P.photo=await shrink(f);renderForm()};
  $("cx").onclick=closeSheet;
  $("rf").onsubmit=async e=>{e.preventDefault();sync();await saveForm()};
}
function sync(){if(!$("bd"))return;picking.building=$("bd").value;picking.floor=$("fl").value;picking.memo=$("mm").value.trim()}
async function saveForm(){
  const P=picking,rec={type:P.type,building:P.building,floor:P.floor,memo:P.memo,lat:P.lat,lng:P.lng,photo:P.photo||null,createdAt:new Date().toISOString()};
  $("sv").disabled=true;
  try{
    if(P.mode==="admin"){await DB.addFacility(rec);toast(`${TYPES[rec.type].name}을(를) 지도에 추가했어요`)}
    else{await DB.addReport(rec);toast("제보했어요. 관리자 확인 후 지도에 표시돼요")}
    const wasAdmin=P.mode==="admin";closeSheet();if(wasAdmin)openAdmin();
  }catch(e){$("sv").disabled=false;toast("저장하지 못했어요. 인터넷 연결을 확인해주세요")}
}

/* ---------- 관리자 화면 ---------- */
const ADMIN_HASH="길을알려조";   // 주소 뒤에 #길을알려조 를 붙이면 관리자 화면
const isAdminHash=()=>{try{return decodeURIComponent(location.hash.slice(1))===ADMIN_HASH}catch(e){return false}};
function openAdmin(){$("admin").hidden=false;renderAdmin();if(!isAdminHash())history.replaceState(null,"","#"+encodeURIComponent(ADMIN_HASH))}
function closeAdmin(){$("admin").hidden=true;if(location.hash)history.replaceState(null,"",location.pathname)}
$("adminBtn").onclick=openAdmin;
window.addEventListener("hashchange",()=>isAdminHash()?openAdmin():closeAdmin());
function renderAdmin(){
  const A=$("admin");
  if(!S.isAdmin){
    A.innerHTML=`<div class="top"><h2>관리자 로그인</h2><button class="btn btn-ghost btn-sm" id="aClose">지도로</button></div>
    <form class="card login" id="lf">
      ${S.mode==="demo"?`<div class="demo">시연 모드예요. 비밀번호는 코드의 <b>DEMO_ADMIN_PASSWORD</b> 값이고, 데이터는 이 기기에만 저장돼요. 실제 운영은 Firebase를 연결하세요.</div>`:""}
      ${S.mode==="firebase"?'<label class="f">이메일<input id="lEmail" type="email" autocomplete="username" required></label>':""}
      <label class="f">비밀번호<span style="display:flex;gap:6px"><input id="lPw" type="password" autocomplete="current-password" autocapitalize="off" required><button type="button" class="btn btn-ghost btn-sm" id="pwEye" aria-label="비밀번호 보기" style="flex:none">👁</button></span></label>
      <button class="btn btn-pri" id="lBtn">로그인</button>
      <p class="note" id="lErr" hidden style="color:var(--aed)"></p>
    </form>`;
    $("aClose").onclick=closeAdmin;
    $("pwEye").onclick=()=>{const i=$("lPw");i.type=i.type==="password"?"text":"password"};
    $("lf").onsubmit=async e=>{e.preventDefault();const err=$("lErr");err.hidden=true;$("lBtn").disabled=true;
      try{await DB.login($("lEmail")?$("lEmail").value.trim():"",$("lPw").value);toast("관리자로 로그인했어요")}
      catch(x){err.textContent="이메일 또는 비밀번호가 맞지 않아요";err.hidden=false;$("lBtn").disabled=false}};
    return;
  }
  const pend=S.reports;
  let body="";
  if(adminTab==="pending"){
    body=pend.length?pend.map(r=>`<div class="card rep">${r.photo?`<img src="${r.photo}" alt="제보 사진">`:'<div class="nophoto">사진 없음</div>'}
      <div class="body"><div class="meta"><span class="tag" style="background:${TYPES[r.type].color}">${TYPES[r.type].name}</span><span class="tag pend">승인 대기</span></div>
      <div class="t">${esc(r.building)} ${esc(r.floor)}</div><div class="note">${esc(r.memo)||"상세 위치 없음"}</div>
      <div class="note">${new Date(r.createdAt).toLocaleString("ko-KR")}</div>
      <div class="acts"><button class="btn btn-pri btn-sm" data-ok="${r.id}">승인</button><button class="btn btn-danger btn-sm" data-no="${r.id}">반려</button><button class="btn btn-ghost btn-sm" data-see="${r.id}">위치 보기</button></div></div></div>`).join("")
      :`<div class="card"><b>대기 중인 제보가 없어요</b><p class="note">일반 사용자가 '제보하기'로 보낸 시설이 여기 쌓여요. 사진과 위치를 확인하고 승인하면 지도에 바로 표시돼요.</p></div>`;
  }else{
    const list=S.facilities.slice().sort((a,b)=>a.building.localeCompare(b.building,"ko")||fNum(String(a.floor).split(/[~·]/)[0])-fNum(String(b.floor).split(/[~·]/)[0]));
    body=`<button class="btn btn-pri" id="addF">＋ 지도에서 시설 직접 추가</button>
      ${S.mode==="firebase"&&!S.facilities.length?'<button class="btn btn-ghost" id="seed">공개 데이터 넣기</button>':""}
      ${list.map(f=>`<div class="frow"><span class="pin" style="width:24px;height:24px;background:${TYPES[f.type].color}">${TYPES[f.type].glyph}</span>
        <div class="d"><b>${esc(f.building)} · ${esc(f.floor)} ${TYPES[f.type].name}</b><span>${esc(f.memo)||"-"}${f.src?" · "+esc(f.src):""}</span></div>
        <button class="btn btn-danger btn-sm" data-del="${f.id}">제외</button></div>`).join("")}`;
  }
  A.innerHTML=`<div class="top"><h2>관리자</h2><button class="btn btn-ghost btn-sm" id="aOut">로그아웃</button><button class="btn btn-ghost btn-sm" id="aClose">지도로</button></div>
   <div class="list">
    ${S.mode==="demo"?'<div class="demo">시연 모드: 이 기기에서 보낸 제보만 보여요. 팀원 제보를 모으려면 Firebase를 연결하세요.</div>':""}
    <div class="tabs" role="tablist"><button role="tab" aria-selected="${adminTab==="pending"}" data-tab="pending">승인 대기${pend.length?`<span class="badge">${pend.length}</span>`:""}</button><button role="tab" aria-selected="${adminTab==="list"}" data-tab="list">시설 관리 (${S.facilities.length})</button></div>
    ${body}
   </div>`;
  $("aClose").onclick=closeAdmin;$("aOut").onclick=async()=>{await DB.logout();toast("로그아웃했어요")};
  A.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{adminTab=b.dataset.tab;renderAdmin()});
  A.querySelectorAll("[data-ok]").forEach(b=>b.onclick=async()=>{const r=pend.find(x=>x.id===b.dataset.ok);b.disabled=true;
    try{await DB.approve(r);toast("승인했어요. 지도에 추가됐어요")}catch(e){b.disabled=false;toast("승인하지 못했어요")}});
  A.querySelectorAll("[data-no]").forEach(b=>b.onclick=async()=>{if(!confirm("이 제보를 반려(삭제)할까요?"))return;await DB.delReport(b.dataset.no);toast("반려했어요")});
  A.querySelectorAll("[data-see]").forEach(b=>b.onclick=()=>{const r=pend.find(x=>x.id===b.dataset.see);closeAdmin();follow=false;map.setView([r.lat,r.lng],19);
    const m=L.circleMarker([r.lat,r.lng],{radius:14,color:"#b7791f",weight:3,fillOpacity:.2}).addTo(map);setTimeout(()=>map.removeLayer(m),6000);toast(`${r.building} ${r.floor} 제보 위치예요`)});
  A.querySelectorAll("[data-del]").forEach(b=>b.onclick=async()=>{const f=S.facilities.find(x=>x.id===b.dataset.del);
    if(!confirm(`${f.building} ${f.floor} ${TYPES[f.type].name}을(를) 지도에서 제외할까요?`))return;await DB.delFacility(f.id);toast("제외했어요")});
  if($("addF"))$("addF").onclick=()=>{closeAdmin();openForm("admin")};
  if($("seed"))$("seed").onclick=async()=>{await DB.loadSeed();toast("공개 데이터를 넣었어요")};
}


/* ---------- 내부지도 (피난안내도 사진) ---------- */
let pvMap=null,pvImg=null,pvState=null;
const planFloor=(b,f)=>PLANS[b]&&PLANS[b][f]?f:null;
function firstPlanFloor(b,pref){if(!PLANS[b])return null;if(pref&&PLANS[b][pref])return pref;const fl=(BUILDINGS[b]||{floors:Object.keys(PLANS[b])}).floors.filter(x=>PLANS[b][x]);return fl[0]||Object.keys(PLANS[b])[0]}
function openPlan(b,floor,hlId){
  floor=firstPlanFloor(b,floor);if(!floor)return;
  pvState={b,floor,hlId};$("pv").hidden=false;
  if(!pvMap){pvMap=L.map("pvMap",{crs:L.CRS.Simple,zoomControl:true,minZoom:-3,maxZoom:3,zoomSnap:0.25,attributionControl:false})}
  renderPlan();
}
function renderPlan(){
  const {b,floor,hlId}=pvState,P=PLANS[b][floor];
  $("pvTitle").textContent=`${b} ${floor} 내부지도`;
  const fls=(BUILDINGS[b]?BUILDINGS[b].floors:Object.keys(PLANS[b])).filter(x=>PLANS[b][x]);
  $("pvTabs").innerHTML=fls.map(x=>{const has=S.facilities.some(f=>f.building===b&&f.type==="aed"&&onFloor(f,x)&&floorsOf(f)?.length===1);return `<button aria-pressed="${x===floor}" class="${has?"has":""}" data-f="${x}">${x}</button>`}).join("");
  $("pvTabs").querySelectorAll("button").forEach(t=>t.onclick=()=>{pvState={b,floor:t.dataset.f,hlId:null};renderPlan()});
  pvMap.eachLayer(l=>pvMap.removeLayer(l));
  const W=P.w,H=P.h,bounds=[[0,0],[H,W]];
  L.imageOverlay(P.src,bounds).addTo(pvMap);
  pvMap.setMaxBounds(L.latLngBounds(bounds).pad(0.25));
  setTimeout(()=>{pvMap.invalidateSize();pvMap.fitBounds(bounds,{padding:[8,8]});pvMap.setMinZoom(pvMap.getZoom()-0.5);
    const hl=hlId&&S.facilities.find(f=>f.id===hlId);if(hl&&hl.px!=null)pvMap.setView([H*(1-hl.py),W*hl.px],Math.min(pvMap.getZoom()+1.25,2))},30);
  const here=S.facilities.filter(f=>f.building===b&&onFloor(f,floor));
  here.filter(f=>f.px!=null&&floorsOf(f)?.length===1).forEach(f=>{
    const t=TYPES[f.type];
    L.marker([H*(1-f.py),W*f.px],{icon:L.divIcon({className:"",iconSize:[30,30],iconAnchor:[15,15],
      html:`<div class="pv-pin ${f.id===hlId?"hl":""}"><span class="ring"></span><span class="dot" style="background:${t.color}">${t.glyph}</span></div>`})})
     .on("click",()=>{closePlan();showDetail(f)}).addTo(pvMap);
  });
  const aedText=here.filter(f=>f.type==="aed"&&f.px==null).map(f=>`<span>♥ AED · ${esc(f.memo)}</span>`).join("");
  const pinned=here.filter(f=>f.px!=null).length;
  $("pvFoot").innerHTML=`${aedText?`<div class="chips2">${aedText}</div>`:""}
    <div>${pinned?"동그란 핀이 AED 위치예요. ":""}도면 속 빨간 표시(소화기·소화전)와 비상구도 함께 확인하세요. 두 손가락으로 확대할 수 있어요.</div>
    <div>출처: 현장 피난안내도·층별 안내판 사진 (2026년 11월 촬영). 실제와 다를 수 있어요.</div>`;
}
function closePlan(){$("pv").hidden=true}
$("pvClose").onclick=closePlan;

/* ---------- 시작 ---------- */
DB.init();startGPS();
if(isAdminHash())openAdmin();
</script>
</body>
</html>
